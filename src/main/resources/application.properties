spring.application.name=demo

# ===============================
# MySQL Database
# ===============================
# In local development: defaults to localhost:3306
# In Docker/EC2: uses DB_HOST (bloodbank-mysql)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bloodbank_db1}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicit Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.cache=false

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:9090}
server.address=0.0.0.0

# ===============================
# Application URL
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:9090}

# ===============================
# Gmail
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3R0b2tlbmtleWZvcmxvY2FsZGV2ZWxvcG1lbnQxMjM0NTY3ODkw}
jwt.expiration=86400000
