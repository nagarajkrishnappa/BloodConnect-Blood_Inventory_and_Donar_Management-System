<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('Manage Donors')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <h1>🩸 Registered Donors Management</h1>
    <p>View and manage all registered blood donors in the system.</p>

    <hr>

    <div style="background:white; padding:20px; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,0.15); margin-top:20px;">
        <table style="width:100%; border-collapse:collapse; text-align:left;">
            <thead>
                <tr style="background:#b30000; color:white;">
                    <th style="padding:12px;">ID</th>
                    <th style="padding:12px;">Full Name</th>
                    <th style="padding:12px;">Email</th>
                    <th style="padding:12px;">Phone</th>
                    <th style="padding:12px;">Blood Group</th>
                    <th style="padding:12px;">City</th>
                    <th style="padding:12px;">Available</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="donor : ${donors}" style="border-bottom:1px solid #eee;">
                    <td style="padding:12px;" th:text="${donor.id}">1</td>
                    <td style="padding:12px;" th:text="${donor.fullName}">John Doe</td>
                    <td style="padding:12px;" th:text="${donor.email}">john@example.com</td>
                    <td style="padding:12px;" th:text="${donor.phone}">1234567890</td>
                    <td style="padding:12px;">
                        <span style="background:#ffebee; color:#c62828; font-weight:bold; padding:4px 8px; border-radius:12px;" th:text="${donor.bloodGroup}">O+</span>
                    </td>
                    <td style="padding:12px;" th:text="${donor.city}">New York</td>
                    <td style="padding:12px;">
                        <span th:if="${donor.available}" style="color:green; font-weight:bold;">Yes</span>
                        <span th:unless="${donor.available}" style="color:red; font-weight:bold;">No</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(donors)}">
                    <td colspan="7" style="padding:20px; text-align:center; color:gray;">No registered donors found.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
