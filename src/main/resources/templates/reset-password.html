<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Reset Password</title>

<style>

body{

font-family:Arial;
background:#f5f5f5;

}

.container{

width:450px;
margin:80px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px gray;

}

input{

width:100%;
padding:10px;
margin-bottom:20px;

}

button{

width:100%;
padding:12px;
background:#d32f2f;
color:white;
border:none;

}

.success{

color:green;

}

.error{

color:red;

}

</style>

</head>

<body>

<div class="container">

<h2>Reset Password</h2>

<div
th:if="${errorMessage}"
class="error"
th:text="${errorMessage}">
</div>

<form
th:action="@{/reset-password}"
th:object="${resetPasswordRequest}"
method="post">

<input
type="hidden"
th:field="*{token}">

<label>New Password</label>

<input
type="password"
th:field="*{newPassword}"
required>

<label>Confirm Password</label>

<input
type="password"
th:field="*{confirmPassword}"
required>

<button type="submit">

Reset Password

</button>

</form>

</div>

</body>

</html>
