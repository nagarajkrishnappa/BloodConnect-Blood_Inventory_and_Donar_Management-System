<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Bank - Login</title>

<link rel="stylesheet" th:href="@{/css/dashboard.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 0;
}

.login-container {
    width: 440px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
}

.login-container h2 {
    color: #c62828;
    text-align: center;
    margin-top: 0;
    margin-bottom: 20px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    color: #333;
}

input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
}

input:focus {
    border-color: #c62828;
    outline: none;
}

.btn-login {
    width: 100%;
    padding: 12px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    margin-top: 20px;
}

.btn-login:hover {
    background: #8e0000;
}

.alert-success {
    background-color: #e8f5e9;
    color: #2e7d32;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    border: 1px solid #c8e6c9;
    text-align: center;
    font-weight: bold;
}

.alert-danger {
    background-color: #ffebee;
    color: #c62828;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    border: 1px solid #ffcdd2;
    text-align: center;
    font-weight: bold;
}

.link-box {
    margin-top: 20px;
    text-align: center;
}

.link-box a {
    color: #007bff;
    text-decoration: none;
    font-weight: bold;
}

.link-box a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<div class="login-container">

    <h2>🩸 User Login</h2>

    <div th:if="${param.error}" class="alert-danger">
        Invalid Email or Password
    </div>

    <div th:if="${param.logout}" class="alert-success">
        Logged out successfully
    </div>

    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/login}" method="post">

        <label><i class="fa-solid fa-envelope"></i> Email Address</label>
        <input type="email" name="username" placeholder="Enter Email Address" required>

        <label><i class="fa-solid fa-lock"></i> Password</label>
        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
        <div style="text-align:right;margin-top:10px;">

    <a th:href="@{/forgot-password}">
        Forgot Password?
    </a>

</div>
    </form>

    <div class="link-box">
        <a th:href="@{/register}">Create New Account</a>
    </div>

</div>

</body>

</html>
