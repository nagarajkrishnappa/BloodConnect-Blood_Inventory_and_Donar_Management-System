<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('My Blood Requests')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="content">

    <h1>📜 My Blood Requests</h1>
    <p>Track the status of your submitted blood requests.</p>

    <hr>

    <!-- Success Alert Banner -->
    <div th:if="${successMessage}" style="background:#e8f5e9; color:#2e7d32; padding:15px; border-radius:5px; margin-bottom:20px; font-weight:bold; border-left:5px solid #2e7d32;">
        <i class="fa-solid fa-circle-check"></i> <span th:text="${successMessage}"></span>
    </div>

    <!-- Requests Table -->
    <div style="background:white; padding:20px; border-radius:8px; box-shadow:0 0 8px rgba(0,0,0,0.15); margin-top:20px;">
        <table style="width:100%; border-collapse:collapse; text-align:left;">
            <thead>
                <tr style="background:#b30000; color:white;">
                    <th style="padding:12px;">Request ID</th>
                    <th style="padding:12px;">Blood Group</th>
                    <th style="padding:12px;">Units Required</th>
                    <th style="padding:12px;">Reason</th>
                    <th style="padding:12px;">Status</th>
                    <th style="padding:12px;">Request Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="request : ${requests}" style="border-bottom:1px solid #eee;">
                    <td style="padding:12px;" th:text="${request.id}">1</td>
                    <td style="padding:12px;">
                        <span style="background:#ffebee; color:#c62828; font-weight:bold; padding:4px 10px; border-radius:12px;" th:text="${request.bloodGroup.value}">O+</span>
                    </td>
                    <td style="padding:12px; font-weight:bold;" th:text="${request.unitsRequired}">2</td>
                    <td style="padding:12px;" th:text="${request.reason}">Emergency</td>
                    <td style="padding:12px;">
                        <span th:if="${request.status.name() == 'APPROVED'}" style="background:#e8f5e9; color:#2e7d32; font-weight:bold; padding:4px 10px; border-radius:12px;">
                            Approved
                        </span>
                        <span th:if="${request.status.name() == 'REJECTED'}" style="background:#ffebee; color:#c62828; font-weight:bold; padding:4px 10px; border-radius:12px;">
                            Rejected
                        </span>
                        <span th:if="${request.status.name() == 'PENDING'}" style="background:#fff8e1; color:#f57f17; font-weight:bold; padding:4px 10px; border-radius:12px;">
                            Pending
                        </span>
                    </td>
                    <td style="padding:12px;" th:text="${#temporals.format(request.requestDate, 'dd-MM-yyyy HH:mm')}">01-01-2026 10:00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="6" style="padding:20px; text-align:center; color:gray;">You have not submitted any blood requests yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
