<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Forgot Password</title>

<style>

body{

font-family:Arial;
background:#f5f5f5;

}

.container{

width:420px;
margin:80px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px gray;

}

input{

width:100%;
padding:10px;
margin-top:10px;
margin-bottom:20px;

}

button{

width:100%;
padding:12px;
background:#d32f2f;
color:white;
border:none;
cursor:pointer;

}

button:hover{

background:#b71c1c;

}

.success{

color:green;
margin-bottom:15px;

}

.error{

color:red;
margin-bottom:15px;

}

a{

text-decoration:none;

}

</style>

</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<div
th:if="${successMessage}"
class="success"
th:text="${successMessage}">
</div>

<div
th:if="${errorMessage}"
class="error"
th:text="${errorMessage}">
</div>

<form
th:action="@{/forgot-password}"
th:object="${forgotPasswordRequest}"
method="post">

<label>Email</label>

<input
type="email"
th:field="*{email}"
required>

<button type="submit">

Send Reset Link

</button>

</form>

<br>

<a th:href="@{/login}">

Back to Login

</a>

</div>

</body>

</html>
