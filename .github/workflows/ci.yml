name: Blood Bank CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # 1. CI: Build & Test
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit and integration tests
        run: ./mvnw clean test

  # ==========================================
  # 2. Build & Push Image to Docker Hub
  # ==========================================
  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bloodconnect-app:latest

  # ==========================================
  # 3. CD: Deploy to Amazon EC2
  # ==========================================
  deploy-to-ec2:
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull newest image from Docker Hub
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bloodconnect-app:latest

            # Stop and remove existing app container
            sudo docker stop bloodbank-app || true
            sudo docker rm bloodbank-app || true

            # Run new container connected to bloodbank-net
            sudo docker run -d \
              --name bloodbank-app \
              --network bloodbank-net \
              -p 9090:9090 \
              -e DB_HOST=bloodbank-mysql \
              ${{ secrets.DOCKERHUB_USERNAME }}/bloodconnect-app:latest

            # Clean up old unused docker images
            sudo docker image prune -f
